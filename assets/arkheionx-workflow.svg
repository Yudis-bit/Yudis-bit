      <text x="1064" y="275" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">prove / trace</text>
      <text x="1064" y="292" font-size="10.5" fill="#7d8ea8" text-anchor="middle">local Foundry proof</text>
    </g>
    <g>
      <rect x="792" y="250" width="168" height="52" rx="9" fill="#14223c" stroke="#57ab5a" stroke-width="1.4"/>
      <text x="876" y="275" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">evidence</text>
      <text x="876" y="292" font-size="10.5" fill="#7d8ea8" text-anchor="middle">package artifacts</text>
    </g>
    <g>
      <rect x="604" y="250" width="168" height="52" rx="9" fill="#14223c" stroke="#57ab5a" stroke-width="1.4"/>
      <text x="688" y="275" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">report</text>
      <text x="688" y="292" font-size="10.5" fill="#7d8ea8" text-anchor="middle">responsible draft</text>
    </g>
    <g>
      <rect x="416" y="250" width="168" height="52" rx="9" fill="#14223c" stroke="#56d4bc" stroke-width="1.4"/>
      <text x="500" y="275" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">validate</text>
      <text x="500" y="292" font-size="10.5" fill="#7d8ea8" text-anchor="middle">check artifacts</text>
    </g>
    <g>
      <rect x="228" y="250" width="168" height="52" rx="9" fill="#172e2a" stroke="#57ab5a" stroke-width="2"/>
      <text x="312" y="275" font-size="14" font-weight="700" fill="#e8f3ea" text-anchor="middle">human review</text>
      <text x="312" y="292" font-size="10.5" fill="#9cc79e" text-anchor="middle">required final step</text>
