    <g>
      <rect x="792" y="110" width="168" height="52" rx="9" fill="#14223c" stroke="#6cb6ff" stroke-width="1.4"/>
      <text x="876" y="135" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">map / flow</text>
      <text x="876" y="152" font-size="10.5" fill="#7d8ea8" text-anchor="middle">protocol &amp; value flow</text>
    </g>
    <g>
      <rect x="980" y="110" width="168" height="52" rx="9" fill="#14223c" stroke="#6cb6ff" stroke-width="1.4"/>
      <text x="1064" y="135" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">hunt</text>
      <text x="1064" y="152" font-size="10.5" fill="#7d8ea8" text-anchor="middle">rank review targets</text>
    </g>
  </g>

  <!-- Row 2 nodes -->
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <g>
