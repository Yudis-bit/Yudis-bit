<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Arkheionx workflow: install/arkup, doctor, demo, open, map/flow, hunt, prove/trace, evidence, report, validate, human review.">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <marker id="wa" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#6a87b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="360" rx="14" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="none" stroke="#243149"/>
  <text x="40" y="42" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8eef7">Arkheionx — local research workflow</text>
  <text x="40" y="64" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7d8ea8">Foundry proves behavior. Arkheionx maps, ranks, proves, packages, and explains the evidence — locally.</text>

  <!-- Row 1 connectors -->
  <g stroke="#6a87b3" stroke-width="1.8" fill="none">
    <path d="M208 136 H222" marker-end="url(#wa)"/>
    <path d="M396 136 H410" marker-end="url(#wa)"/>
    <path d="M584 136 H598" marker-end="url(#wa)"/>
    <path d="M772 136 H786" marker-end="url(#wa)"/>
    <path d="M960 136 H974" marker-end="url(#wa)"/>
    <!-- wrap from hunt down to prove/trace -->
    <path d="M1062 162 V196 a8 8 0 0 1 -8 8 H1070 a8 8 0 0 0 -8 8 V250" marker-end="url(#wa)"/>
    <!-- Row 2 connectors (right to left) -->
    <path d="M980 276 H966" marker-end="url(#wa)"/>
    <path d="M792 276 H778" marker-end="url(#wa)"/>
    <path d="M604 276 H590" marker-end="url(#wa)"/>
    <path d="M416 276 H402" marker-end="url(#wa)"/>
  </g>

