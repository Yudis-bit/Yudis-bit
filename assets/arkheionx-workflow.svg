      <text x="124" y="135" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">install / arkup</text>
      <text x="124" y="152" font-size="10.5" fill="#7d8ea8" text-anchor="middle">set up &amp; update</text>
    </g>
    <g>
      <rect x="228" y="110" width="168" height="52" rx="9" fill="#14223c" stroke="#6cb6ff" stroke-width="1.4"/>
      <text x="312" y="135" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">doctor</text>
      <text x="312" y="152" font-size="10.5" fill="#7d8ea8" text-anchor="middle">check environment</text>
    </g>
    <g>
      <rect x="416" y="110" width="168" height="52" rx="9" fill="#14223c" stroke="#56d4bc" stroke-width="1.4"/>
      <text x="500" y="135" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">demo</text>
      <text x="500" y="152" font-size="10.5" fill="#7d8ea8" text-anchor="middle">guided fixtures</text>
    </g>
    <g>
      <rect x="604" y="110" width="168" height="52" rx="9" fill="#14223c" stroke="#56d4bc" stroke-width="1.4"/>
      <text x="688" y="135" font-size="14" font-weight="600" fill="#dce7f5" text-anchor="middle">open</text>
      <text x="688" y="152" font-size="10.5" fill="#7d8ea8" text-anchor="middle">orient project</text>
