<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Research principle: invariant, state transition, proof and trace, evidence, responsible report.">
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <marker id="ea" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#6a87b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="220" rx="14" fill="url(#ebg)"/>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="14" fill="none" stroke="#243149"/>
  <text x="40" y="44" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8eef7">Evidence over claims</text>

