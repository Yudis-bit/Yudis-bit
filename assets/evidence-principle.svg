    <g>
      <rect x="50" y="120" width="198" height="56" rx="10" fill="#14223c" stroke="#6cb6ff" stroke-width="1.5"/>
      <text x="149" y="154" font-size="15" fill="#dce7f5" text-anchor="middle">Invariant</text>
    </g>
    <g>
      <rect x="275" y="120" width="198" height="56" rx="10" fill="#14223c" stroke="#5cc7d6" stroke-width="1.5"/>
      <text x="374" y="154" font-size="15" fill="#dce7f5" text-anchor="middle">State transition</text>
    </g>
    <g>
