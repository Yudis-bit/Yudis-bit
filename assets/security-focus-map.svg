<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Security focus map across three domains: EVM, SVM, and MoveVM.">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="440" rx="14" fill="url(#sbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="14" fill="none" stroke="#243149"/>
  <text x="40" y="46" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8eef7">Security focus</text>
  <text x="40" y="68" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7d8ea8">State-transition and account-model review across three execution environments.</text>

  <!-- EVM card -->
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="40" y="92" width="360" height="318" rx="11" fill="#11203a" stroke="#27384f"/>
    <rect x="40" y="92" width="360" height="6" rx="3" fill="#6cb6ff"/>
    <text x="64" y="138" font-size="24" font-weight="700" fill="#6cb6ff">EVM</text>
    <text x="64" y="160" font-size="12.5" fill="#8aa0bd">Ethereum &amp; L2s</text>
    <g fill="#cdd9ea" font-size="14.5">
      <circle cx="70" cy="196" r="3.5" fill="#6cb6ff"/><text x="84" y="201">Solidity</text>
      <circle cx="70" cy="232" r="3.5" fill="#6cb6ff"/><text x="84" y="237">Foundry</text>
      <circle cx="70" cy="268" r="3.5" fill="#6cb6ff"/><text x="84" y="273">DeFi accounting</text>
      <circle cx="70" cy="304" r="3.5" fill="#6cb6ff"/><text x="84" y="309">Proxies &amp; upgrade paths</text>
      <circle cx="70" cy="340" r="3.5" fill="#6cb6ff"/><text x="84" y="345">Oracles</text>
    </g>
  </g>

  <!-- SVM card -->
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="420" y="92" width="360" height="318" rx="11" fill="#11203a" stroke="#27384f"/>
    <rect x="420" y="92" width="360" height="6" rx="3" fill="#56d4bc"/>
    <text x="444" y="138" font-size="24" font-weight="700" fill="#56d4bc">SVM</text>
    <text x="444" y="160" font-size="12.5" fill="#8aa0bd">Solana</text>
    <g fill="#cdd9ea" font-size="14.5">
      <circle cx="450" cy="196" r="3.5" fill="#56d4bc"/><text x="464" y="201">Solana accounts</text>
      <circle cx="450" cy="232" r="3.5" fill="#56d4bc"/><text x="464" y="237">PDA authority</text>
      <circle cx="450" cy="268" r="3.5" fill="#56d4bc"/><text x="464" y="273">CPI &amp; instruction ordering</text>
      <circle cx="450" cy="304" r="3.5" fill="#56d4bc"/><text x="464" y="309">Anchor audit workflow</text>
      <circle cx="450" cy="340" r="3.5" fill="#56d4bc"/><text x="464" y="345">Signer / owner checks</text>
    </g>
  </g>

  <!-- MoveVM card -->
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="800" y="92" width="360" height="318" rx="11" fill="#11203a" stroke="#27384f"/>
    <rect x="800" y="92" width="360" height="6" rx="3" fill="#d8a657"/>
    <text x="824" y="138" font-size="24" font-weight="700" fill="#d8a657">MoveVM</text>
    <text x="824" y="160" font-size="12.5" fill="#8aa0bd">Sui &amp; Aptos</text>
    <g fill="#cdd9ea" font-size="14.5">
      <circle cx="830" cy="196" r="3.5" fill="#d8a657"/><text x="844" y="201">Resource safety</text>
      <circle cx="830" cy="232" r="3.5" fill="#d8a657"/><text x="844" y="237">Capabilities &amp; abilities</text>
      <circle cx="830" cy="268" r="3.5" fill="#d8a657"/><text x="844" y="273">Module publishing</text>
      <circle cx="830" cy="304" r="3.5" fill="#d8a657"/><text x="844" y="309">Invariants</text>
      <circle cx="830" cy="340" r="3.5" fill="#d8a657"/><text x="844" y="345">Arithmetic precision</text>
    </g>
  </g>
</svg>
