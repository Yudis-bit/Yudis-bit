<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%" style="background:#0d1117; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="grad-vulkan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-llvm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-kernel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6beb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6beb" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-firmware" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Container Border -->
  <rect x="1" y="1" width="848" height="358" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <path d="M 1 9 C 1 4.5, 4.5 1, 9 1 L 841 1 C 845.5 1, 849 4.5, 849 9 L 849 42 L 1 42 Z" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="20" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="21" r="5.5" fill="#27c93f"/>
  <text x="76" y="25" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="0.5">SYSTEMS SOFTWARE STACK &amp; UPSTREAM TOUCHPOINTS</text>
  <text x="730" y="25" fill="#7d8590" font-size="11" font-weight="500">x86_64 · RV64 · AMDGPU</text>

  <!-- Layer 1: Graphics & Drivers -->
  <g transform="translate(20, 56)">
    <rect x="0" y="0" width="810" height="64" rx="6" fill="url(#grad-vulkan)" stroke="#238636" stroke-width="1"/>
    <text x="16" y="24" fill="#3fb950" font-size="12" font-weight="700" letter-spacing="0.5">GRAPHICS &amp; GPU RUNTIMES</text>
    <text x="16" y="46" fill="#c9d1d9" font-size="11">Khronos Vulkan Validation Layers · SPIR-V · Mesa (RADV) · AMDGPU ISA</text>
    <rect x="670" y="16" width="124" height="24" rx="12" fill="#238636" fill-opacity="0.25" stroke="#238636" stroke-width="1"/>
    <text x="732" y="32" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">MERGED (VVL)</text>
  </g>

  <!-- Layer 2: Compilers & Toolchains -->
  <g transform="translate(20, 128)">
    <rect x="0" y="0" width="810" height="64" rx="6" fill="url(#grad-llvm)" stroke="#d29922" stroke-width="1"/>
    <text x="16" y="24" fill="#d29922" font-size="12" font-weight="700" letter-spacing="0.5">COMPILERS &amp; TOOLCHAINS</text>
    <text x="16" y="46" fill="#c9d1d9" font-size="11">LLVM Core · SelectionDAG · SILoadStoreOptimizer · RISC-V Codegen &amp; ABI</text>
    <rect x="635" y="16" width="159" height="24" rx="12" fill="#d29922" fill-opacity="0.25" stroke="#d29922" stroke-width="1"/>
    <text x="714.5" y="32" fill="#d29922" font-size="10" font-weight="700" text-anchor="middle">APPROVED (AMDGPU)</text>
  </g>

  <!-- Layer 3: Operating Systems & Kernel -->
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="810" height="64" rx="6" fill="url(#grad-kernel)" stroke="#1f6beb" stroke-width="1"/>
    <text x="16" y="24" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="0.5">OPERATING SYSTEMS &amp; KERNEL</text>
    <text x="16" y="46" fill="#c9d1d9" font-size="11">Linux Kernel · Maintainer Tree Patches · Dynamic Tracing (ftrace) · Syscalls</text>
    <rect x="650" y="16" width="144" height="24" rx="12" fill="#1f6beb" fill-opacity="0.25" stroke="#1f6beb" stroke-width="1"/>
    <text x="722" y="32" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">ACCEPTED (LINUX)</text>
  </g>

  <!-- Layer 4: Firmware & Virtualization -->
  <g transform="translate(20, 272)">
    <rect x="0" y="0" width="810" height="64" rx="6" fill="url(#grad-firmware)" stroke="#8957e5" stroke-width="1"/>
    <text x="16" y="24" fill="#bc8cff" font-size="12" font-weight="700" letter-spacing="0.5">FIRMWARE &amp; VIRTUALIZATION</text>
    <text x="16" y="46" fill="#c9d1d9" font-size="11">RISC-V OpenSBI (SBI Ecalls) · QEMU (x86_64 Long Mode Segment Decoding)</text>
    <rect x="585" y="16" width="209" height="24" rx="12" fill="#8957e5" fill-opacity="0.25" stroke="#8957e5" stroke-width="1"/>
    <text x="689" y="32" fill="#bc8cff" font-size="10" font-weight="700" text-anchor="middle">REVIEW (OPENSBI) / TESTED-BY (QEMU)</text>
  </g>
</svg>
