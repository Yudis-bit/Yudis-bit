<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc">
  <title id="title">Yudistira Putra — systems software</title>
  <desc id="desc">Software developer from Indonesia. C, C++, Rust. Compilers, protocols, cryptography and firmware. A byte grid shows the opening bytes of an ELF file.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#263331" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="281" rx="14" fill="#101817" stroke="#33433e"/>
  <path d="M650 1H985Q999 1 999 15V267Q999 281 985 281H650Z" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="39" cy="38" r="4" fill="#a8d5b5"/>
    <text x="53" y="42" fill="#b8c8bd" font-size="12" font-weight="600" letter-spacing="2">SYSTEMS SOFTWARE</text>
    <text x="962" y="42" text-anchor="end" fill="#9baea3" font-size="13">from Indonesia</text>
    <text x="34" y="118" fill="#f2f0e8" font-size="51" font-weight="650" letter-spacing="-1.8">Yudistira Putra</text>
    <text x="37" y="154" fill="#bac8bd" font-size="18">Compilers, protocols, cryptography &amp; firmware.</text>
    <text x="37" y="190" fill="#a8d5b5" font-size="15" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">C / C++ / Rust</text>
    <path d="M37 222H963" stroke="#33433e"/>
    <path d="M37 222H130" stroke="#d9b477" stroke-width="2"/>
    <text x="37" y="255" fill="#a8b9ad" font-size="13">LLVM / AMDGPU</text>
    <text x="283" y="255" fill="#a8b9ad" font-size="13">QUIC</text>
    <text x="529" y="255" fill="#a8b9ad" font-size="13">secp256k1</text>
    <text x="963" y="255" text-anchor="end" fill="#a8b9ad" font-size="13">RISC-V</text>
  </g>
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="16" text-anchor="middle">
    <text x="715" y="92" fill="#83988a" font-size="10">00</text>
